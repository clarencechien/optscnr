<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>台股週報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+TC:wght@400;500;700&display=swap">
<style>
  :root { color-scheme: light; --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ee; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --hair:#e1e0d9; --accent:#2a78d6; --accent-soft:#cde2fb; --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --deemph:#c3c2b7; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --page:#0d0d0d; --surface:#1a1a19; --surface-2:#222220; --ink:#fff; --ink-2:#c3c2b7;
    --hair:#2c2c2a; --accent:#3987e5; --accent-soft:#1c3a5e; --deemph:#383835; } }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--page); color:var(--ink); font:16px/1.7 "IBM Plex Sans", "IBM Plex Sans TC", system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  .paper { max-width: 760px; margin: 0 auto; padding: 28px 20px 64px; }
  .masthead { border-bottom: 2px solid var(--ink); padding-bottom: 12px; margin-bottom: 20px; display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  .masthead h1 { margin:0; font-size: 26px; font-weight: 700; } .masthead .date { font-size: 14px; color: var(--ink-2); }
  .nav { margin-left:auto; font-size:14px; display:flex; gap:12px; }
  h2 { font-size: 17px; margin: 30px 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--hair); }
  h2 .n { display:inline-block; width:24px; height:24px; border-radius:50%; background:var(--ink); color:var(--page); font-size:13px; text-align:center; line-height:24px; margin-right:8px; }
  .tldr { background: var(--surface); border:1px solid var(--hair); border-left: 4px solid var(--accent); border-radius: 10px; padding: 14px 16px; }
  .tldr ul { margin: 0; padding-left: 18px; } .tldr li { margin: 5px 0; }
  .lights { display:flex; gap:8px; flex-wrap:wrap; margin: 10px 0 0; }
  .light { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--hair); color:var(--ink-2); }
  .light i { width:8px; height:8px; border-radius:50%; display:inline-block; background:var(--muted); }
  .light.ok i{background:var(--good)} .light.warn i{background:var(--warn)} .light.bad i{background:var(--crit)}
  .card { background: var(--surface); border:1px solid var(--hair); border-radius: 12px; padding: 14px 16px; margin: 10px 0; }
  .big { font-size: 20px; font-weight: 700; }
  .action { border-left: 4px solid var(--accent); padding-left: 12px; margin: 8px 0; }
  .kv { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 14px; margin: 10px 0; font-size: 14px; }
  .kv b { display:block; color:var(--muted); font-weight:500; font-size:12px; } .kv span { font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; } th, td { padding: 7px 8px; border-bottom: 1px solid var(--hair); text-align: left; }
  th { color: var(--ink-2); font-size: 13px; font-weight: 600; } td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-size: 14px; }
  .path { display:flex; gap:6px; flex-wrap:wrap; } .path span { padding:3px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--hair); font-size:13px; }
  .checks { list-style:none; padding:0; margin:0; } .checks li { display:flex; gap:10px; align-items:flex-start; padding: 7px 0; border-bottom:1px solid var(--hair); font-size: 15px; }
  .checks li:last-child { border-bottom: 0; } .checks i { width:10px; height:10px; border-radius:50%; margin-top:8px; flex:none; background:var(--muted); }
  .checks .ok i{background:var(--good)} .checks .warn i{background:var(--warn)} .checks .bad i{background:var(--crit)}
  .foot { margin-top: 32px; padding-top: 12px; border-top: 1px solid var(--hair); font-size: 13px; color: var(--muted); line-height: 1.7; }
  .empty { padding: 18px; text-align:center; color: var(--ink-2); background: var(--surface); border:1px dashed var(--hair); border-radius: 10px; }
  @media print { .nav { display:none; } body { background:#fff; } }
</style>
</head>
<body>
<main class="paper">
  <div class="masthead">
    <div><h1>📬 台股週報</h1><div class="date" id="date">載入中…</div></div>
    <div class="nav"><a href="/brief">美股電子報</a><a href="/">dashboard</a></div>
  </div>

  <div class="tldr"><ul id="tldr"><li>讀取中…</li></ul><div class="lights" id="lights"></div></div>

  <h2><span class="n">1</span>本期機械指示（DCA 規則影子帳本）</h2>
  <div id="dca"></div>

  <h2><span class="n">2</span>天氣（籌碼溫度計）</h2>
  <div id="weather"></div>

  <h2><span class="n">3</span>2308 論點監控</h2>
  <div id="delta"></div>

  <h2><span class="n">4</span>下週日曆</h2>
  <div class="card" id="calendar"></div>

  <h2><span class="n">5</span>資料健康</h2>
  <div class="card"><ul class="checks" id="checks"></ul></div>

  <div class="foot">
    唯讀頁，每 5 分鐘從 GitHub 讀 <code>tw_scanner/output/tw_brief.json</code>；不觸發任何動作。
    規則影子帳本是等額假設，不記真實部位；沒有任何一行是買賣建議，曝險與部位由人管。
    人讀版與明細：<a href="https://github.com/clarencechien/optscnr/blob/main/tw_scanner/README.md" target="_blank" rel="noopener">tw_scanner/README.md</a>。
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pm = (x, u = '%') => (x == null ? '—' : (x > 0 ? '+' : '') + Number(x).toFixed(2) + u);
const n0 = x => (x == null ? '—' : Number(x).toLocaleString('zh-TW', { maximumFractionDigits: 0 }));
const LIGHT = { GREEN: '🟢', YELLOW: '🟡', RED: '🔴', NO_DATA: '⚪' };
const tpe = iso => { try { return new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso)); } catch { return iso; } };

function render(b) {
  $('#date').textContent = `週報 ${b.today}｜產出 ${tpe(b.generated_at)}（台北）`;
  $('#tldr').innerHTML = (b.tldr || []).map(x => `<li>${esc(x)}</li>`).join('');
  $('#lights').innerHTML = (b.checks || []).map(c => `<span class="light ${c.level}" title="${esc(c.text)}"><i></i>${esc(c.label)}</span>`).join('');

  const d = b.dca || {};
  if (d.status !== 'OK') $('#dca').innerHTML = `<div class="empty">NO_DATA：${esc(d.reason || '缺 dca_ledger.json')}</div>`;
  else {
    const c = d.current || {}, wg = c.weekly_gate;
    const rules = Object.values((d.full || {}).rules || {});
    $('#dca').innerHTML = `<div class="card">
      ${wg ? `<div class="action"><div class="big">${esc(wg.text)}</div><div class="muted">週檢查・月預算（決策日 ${esc(wg.decision_date)}）</div></div>` : ''}
      <div class="kv">
        <div><b>例行（對照）</b><span>${esc(c.next_regular_buy)} 買 ${n0(c.plain_amount)} 元${c.this_month_bought ? '（本月已買）' : ''}</span></div>
        <div><b>投降窗加碼</b><span>${c.boost_pending ? '待執行 ' + n0(c.boost_amount) + ' 元' : '無'}</span></div>
        <div><b>鋒面調節（假說）</b><span>${esc(c.regime)} ×${c.regime_multiplier} = ${n0(c.regime_amount)} 元</span></div>
        <div><b>${esc(d.instrument)} 收盤</b><span>${c.last_price} (${esc(c.as_of)})</span></div>
      </div>
      <div class="muted">自 ${esc((d.full || {}).start)} 起 ${(d.full || {}).n_periods} 期，等額假設：</div>
      <table><thead><tr><th>規則</th><th class="num">買次</th><th class="num">平均成本</th><th class="num">vs 純 DCA</th><th class="num">報酬</th><th class="num">XIRR</th></tr></thead>
      <tbody>${rules.map(r => `<tr><td>${esc(r.label)}</td><td class="num">${r.n_buys}</td><td class="num">${r.avg_cost ?? '—'}</td><td class="num">${pm(r.avg_cost_vs_plain_pct)}</td><td class="num">${pm(r.return_pct)}</td><td class="num">${pm(r.xirr_pct)}</td></tr>`).join('')}</tbody></table>
      <div class="muted" style="margin-top:8px">投降窗加碼 ${(d.full || {}).boost_n ?? 0} 次${(d.full || {}).boost_n ? `：比等到例行日買平均便宜 ${pm((d.full || {}).boost_edge_mean_pct)}、勝率 ${(d.full || {}).boost_edge_win_pct}%` : ''}。lump_sum 是對照不是策略；regime_scaled 是待處決的假說。</div>
    </div>`;
  }

  const w = b.weather || {};
  if (w.status !== 'OK') $('#weather').innerHTML = '<div class="empty">NO_DATA</div>';
  else {
    const p = w.pcts || {}, cap = w.capitulation_backtest, h20 = ((cap || {}).horizons || {})['20d'] || {};
    $('#weather').innerHTML = `<div class="card">
      <div class="big">${esc(w.emoji)} ${esc(w.regime)} <span class="muted">score ${pm(w.score, '')}・${esc(w.as_of)}</span></div>
      <div class="path" style="margin:8px 0">${(w.week_path || []).map(x => `<span>${esc(x.date.slice(5))} ${esc(x.regime)}${(x.alerts || []).length ? ' 🚨' : ''}</span>`).join('')}</div>
      <div class="kv">
        <div><b>外資現貨 20 日</b><span>第 ${p.f_spot_20d ?? '—'} 百分位</span></div>
        <div><b>外資大台 Δ</b><span>第 ${p.tx_delta ?? '—'} 百分位</span></div>
        <div><b>散戶小台</b><span>第 ${p.retail_mtx ?? '—'} 百分位</span></div>
        <div><b>融資 Δ</b><span>第 ${p.margin_chg ?? '—'} 百分位</span></div>
      </div>
      <div class="muted">本週投降警報：${(w.week_alert_days || []).length ? esc(w.week_alert_days.join('、')) : '無'}${cap ? `。警報戰績（月更回測）：${cap.episodes} 簇，20 日中位 ${pm(h20.median_pct)} vs 基線 ${pm(h20.baseline_median_pct)}、命中 ${Math.round((h20.hit_rate || 0) * 100)}%` : ''}</div>
    </div>`;
  }

  const dl = b.delta || {};
  if (dl.status !== 'OK') $('#delta').innerHTML = '<div class="empty">NO_DATA</div>';
  else {
    const dv = dl.divergence || {};
    $('#delta').innerHTML = `<div class="card">
      <div class="big">${LIGHT[dl.full_overall] || '⚪'} ${esc(dl.full_overall || '尚無全模組判定')} <span class="muted">最近全模組 ${esc(dl.full_ts || '—')}</span></div>
      <div class="${dv.flag ? 'action' : 'muted'}" style="margin:8px 0">${esc(dv.text || '背離 NO_DATA')}</div>
      <table><tbody>${(dl.modules || []).map(m => `<tr><td>${LIGHT[m.status] || '⚪'} ${esc(m.module)}</td><td class="muted">${esc(m.headline)}</td></tr>`).join('')}</tbody></table>
      <div class="muted" style="margin-top:8px">回填樣本 ${dl.scored_n} 筆（T+20 超額 vs 0050）；退役判準表在 delta_radar_report.md。</div>
    </div>`;
  }

  $('#calendar').innerHTML = (b.calendar || []).length ? (b.calendar || []).map(c => `<div>${esc(c.date)}（${c.days} 天後）${esc(c.what)}</div>`).join('') : '<span class="muted">無規則式事件</span>';
  $('#checks').innerHTML = (b.checks || []).map(c => `<li class="${c.level}"><i></i><span>${esc(c.text)}</span></li>`).join('');
}

(async () => {
  try {
    const r = await fetch('/api/tw', { cache: 'no-store' });
    if (!r.ok) throw new Error(`/api/tw ${r.status}`);
    render(await r.json());
  } catch (e) {
    $('#date').textContent = '讀取失敗';
    $('#tldr').innerHTML = `<li>週報資料讀不到：${esc(String(e.message || e))}。人讀版在 <a href="https://github.com/clarencechien/optscnr/blob/main/tw_scanner/README.md">tw_scanner/README.md</a>。</li>`;
  }
})();
</script>
</body>
</html>
