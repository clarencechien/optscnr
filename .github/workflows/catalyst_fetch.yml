name: Daily Catalyst Fetch

on:
  schedule:
    # catalyst_fetch.yml — 台灣週一到週六 04:30 早一點半
    - cron: '37 20 * * 0-5'   # UTC 20:30
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run catalyst fetch
        run: python catalyst_fetch.py
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalyst_today.json
          git diff --quiet --cached || git commit -m "📰 Daily catalyst fetch [skip ci]"
          git push
