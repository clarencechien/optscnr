name: Daily Catalyst Fetch

on:
  schedule:
    # catalyst_fetch.yml — 台灣週一到週六 04:30 早一點半
    - cron: '37 20 * * 0-5'   # UTC 20:30
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run catalyst fetch
        run: python catalyst_fetch.py
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalyst_today.json
          git diff --quiet --cached || git commit -m "📰 Daily catalyst fetch [skip ci]"
          # push 前先 rebase 到最新 main：排程延遲會讓多個 workflow 擠在同一時段 push，
          # 沒 rebase 就被 non-fast-forward 拒絕、整次掃描結果丟失（2026-09-02 事故）。
          # 各 workflow 寫的檔案互不重疊，rebase 不會衝突；三次重試後仍失敗就大聲失敗。
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
            echo "::warning::push 第 $i 次失敗，$((i * 10))s 後重試"; sleep $((i * 10))
          done
          [ "$ok" = 1 ] || { echo "::error::push 三次皆失敗"; exit 1; }
