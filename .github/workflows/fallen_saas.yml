name: Weekly Fallen SaaS Scan

on:
  schedule:
    # 台灣週日早上 9:00 = UTC 週六 01:00
    # 排在 small_cap_momentum (UTC 週六 00:00) 後面，避免衝突
    - cron: '0 1 * * 6'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run fallen SaaS scan
        run: python fallen_saas.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fallen_saas.json
          git diff --quiet --cached || git commit -m "💀 Weekly fallen SaaS scan [skip ci]"
          git push
