name: tsmc-radar

on:
  schedule:
    - cron: "11 3 * * *"     # daily   03:11 UTC = 11:11 Taipei - M5 narrative only
    - cron: "17 4 * * 1,4"   # Mon/Thu 04:17 UTC = 12:17 Taipei - full scan (offset from daily)
    - cron: "23 5 10-12 * *" # 10th-12th 05:23 UTC = 13:23 Taipei - M1 revenue-judgment window
  workflow_dispatch:
    inputs:
      modules:
        description: "modules to run (e.g. m1,m2,m3,m4,m5,m6,m8,m9)"
        default: "m1,m2,m3,m4,m5,m6,m8,m9"

permissions:
  contents: write

concurrency:
  group: tsmc-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve track
        id: track
        # tsmc_radar：與 delta_radar 同一支程式、不同 config；排程錯開 30 分鐘。
        # Route by which cron fired. Manual dispatch takes the input as-is.
        #   daily        -> m5 only, commit only on status change
        #   mon/thu      -> all modules, always commit
        #   10th-12th    -> m1 only (monthly-revenue judgment day; 3-day window
        #                   because the release date drifts), commit on change
        run: |
          set -euo pipefail
          SCHED="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "modules=${{ github.event.inputs.modules }}" >> "$GITHUB_OUTPUT"
            echo "commit_mode=always" >> "$GITHUB_OUTPUT"
            echo "track=manual" >> "$GITHUB_OUTPUT"
          elif [ "$SCHED" = "11 3 * * *" ]; then
            echo "modules=m5" >> "$GITHUB_OUTPUT"
            echo "commit_mode=on_change" >> "$GITHUB_OUTPUT"
            echo "track=narrative-daily" >> "$GITHUB_OUTPUT"
          elif [ "$SCHED" = "17 4 * * 1,4" ]; then
            echo "modules=m1,m2,m3,m4,m5,m6,m8,m9" >> "$GITHUB_OUTPUT"
            echo "commit_mode=always" >> "$GITHUB_OUTPUT"
            echo "track=full-scan" >> "$GITHUB_OUTPUT"
          elif [ "$SCHED" = "23 5 10-12 * *" ]; then
            echo "modules=m1" >> "$GITHUB_OUTPUT"
            echo "commit_mode=on_change" >> "$GITHUB_OUTPUT"
            echo "track=revenue-day" >> "$GITHUB_OUTPUT"
          else
            echo "::error::unrecognized schedule '$SCHED' - update Resolve track"
            exit 1
          fi

      - name: Install deps
        run: pip install -r tw_scanner/requirements.txt

      - name: Snapshot previous statuses
        id: prev
        # Capture module statuses BEFORE the run so on_change tracks can diff.
        # state.json is append-only; we read the last entry's per-module statuses.
        run: |
          set -euo pipefail
          python - <<'EOF' > prev_status.txt || echo "NONE" > prev_status.txt
          import json
          h = json.load(open("tw_scanner/output/tsmc_radar_state.json"))
          print("|".join(f"{m['module']}={m['status']}" for m in h[-1]["modules"]))
          EOF
          echo "statuses=$(cat prev_status.txt)" >> "$GITHUB_OUTPUT"

      - name: Run radar (${{ steps.track.outputs.track }})
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          python tw_scanner/delta_radar.py \
            --config tw_scanner/config/tsmc_radar_config.json \
            --output-dir tw_scanner/output \
            --modules "${{ steps.track.outputs.modules }}"

      - name: Decide whether to commit
        id: gate
        run: |
          set -euo pipefail
          MODE="${{ steps.track.outputs.commit_mode }}"
          if [ "$MODE" = "always" ]; then
            echo "do_commit=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CUR=$(python - <<'EOF'
          import json
          h = json.load(open("tw_scanner/output/tsmc_radar_state.json"))
          print("|".join(f"{m['module']}={m['status']}" for m in h[-1]["modules"]))
          EOF
          )
          PREV="${{ steps.prev.outputs.statuses }}"
          if [ "$CUR" = "$PREV" ]; then
            echo "Status unchanged ($CUR) - skipping commit."
            # Revert the working tree so the redundant state entry is discarded
            # and state.json stays an information-bearing series, not a heartbeat log.
            git checkout -- tw_scanner/output/tsmc_radar_report.md tw_scanner/output/tsmc_radar_state.json
            echo "do_commit=false" >> "$GITHUB_OUTPUT"
          else
            echo "Status changed: '$PREV' -> '$CUR'"
            echo "do_commit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit results
        if: steps.gate.outputs.do_commit == 'true'
        # NOTE: do NOT collapse this into `git add ... || true`.
        # The silent-swallow pattern on conditionally-absent files is the exact
        # bug class fixed across this repo's workflows - fail loudly instead.
        run: |
          set -euo pipefail
          for f in tw_scanner/output/tsmc_radar_report.md \
                   tw_scanner/output/tsmc_radar_state.json; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "::error::expected radar output missing: $f"
              exit 1
            fi
          done
          # 週報重組（零網路：讀既有輸出）+ 資料夾 README
          python tw_scanner/tw_brief.py --output-dir tw_scanner/output
          for f in tw_scanner/output/tw_brief.json tw_scanner/output/tw_weekly.md; do
            if [ -f "$f" ]; then git add "$f"; else echo "::error::brief output missing: $f"; exit 1; fi
          done
          python tw_scanner/build_readme.py
          git add tw_scanner/README.md
          if git diff --cached --quiet; then
            echo "No content changes to commit."
            exit 0
          fi
          git config user.name "tsmc-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash
          git commit -m "tsmc_radar[${{ steps.track.outputs.track }}]: $(date -u +%F)"
          git push
