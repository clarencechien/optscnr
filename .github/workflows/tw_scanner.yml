name: tw-scanner

on:
  schedule:
    - cron: "52 13 * * 1-5"  # 13:45 UTC = 21:45 Taipei, Mon-Fri - after margin (~21:00) publishes; all 4 features complete
    - cron: "58 14 1 * *"    # monthly, 1st - backtest revalidation: re-judge the capitulation alert on accrued data
  workflow_dispatch:
    inputs:
      mode:
        description: "briefing | backtest | backfill"
        default: "briefing"

permissions:
  contents: write

concurrency:
  group: tw-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r tw_scanner/requirements.txt

      - name: Resolve mode
        id: mode
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "58 14 1 * *" ]; then
            echo "mode=backtest" >> "$GITHUB_OUTPUT"
          else
            echo "mode=briefing" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tw_scanner (${{ steps.mode.outputs.mode }})
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -euo pipefail
          FLAGS=""
          case "${{ steps.mode.outputs.mode }}" in
            backtest) FLAGS="--backtest" ;;
            backfill) FLAGS="--backfill" ;;
          esac
          python tw_scanner/tw_scanner.py $FLAGS \
            --config tw_scanner/config/tw_scanner_config.json \
            --output-dir tw_scanner/output

      - name: DCA 規則影子帳本 + 週報組裝（推導物；FinMind 抓不到就用價格快取）
        if: steps.mode.outputs.mode != 'backtest'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -euo pipefail
          python tw_scanner/dca_ledger.py --output-dir tw_scanner/output
          python tw_scanner/casino_tracker.py --output-dir tw_scanner/output
          python tw_scanner/tw_brief.py --output-dir tw_scanner/output

      - name: Commit results（共用 publish.sh：先主輸出、pull 後重產生衍生檔、push 重試）
        run: |
          set -euo pipefail
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$MODE" = "backtest" ]; then
            PRIMARY="tw_scanner/output/tw_scanner_backtest.md tw_scanner/output/tw_scanner_backtest.json"
          else
            PRIMARY="tw_scanner/output/tw_scanner_briefing.md tw_scanner/output/tw_scanner_state.json \
                     tw_scanner/output/tw_scanner_history.json \
                     tw_scanner/output/dca_ledger.md tw_scanner/output/dca_ledger.json \
                     tw_scanner/output/casino_report.md tw_scanner/output/casino_brief.json tw_scanner/output/casino_state.json"
            # 價格／營收快取（首跑才有）與 cache CSV：存在才列
            for f in tw_scanner/output/dca_prices.json tw_scanner/output/casino_prices.json tw_scanner/output/casino_revenue.json; do
              if [ -f "$f" ]; then PRIMARY="$PRIMARY $f"; fi
            done
            if [ -d tw_scanner/cache ]; then git add tw_scanner/cache; fi
          fi
          tw_scanner/publish.sh "tw-scanner-bot" "tw_scanner[$MODE]: $(date -u +%F)" $PRIMARY
