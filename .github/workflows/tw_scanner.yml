name: Taiwan Market Institutional and Retail Scanner

on:
  schedule:
    # 台北時間週一至週五晚上 21:30 自動執行 (對應國際標準時 UTC 13:30)
    - cron: '30 13 * * 1-5'
  workflow_dispatch: # 允許你隨時在 GitHub 網頁上「手動點擊執行(Run workflow)」按鈕

permissions:
  contents: write # 給予 GitHub Action 權限可以將產出的 output.md 自動推回你的 repository

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # 開啟快取，加速後續執行

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f tw_scanner/requirements.txt ]; then pip install -r tw_scanner/requirements.txt; fi

    - name: Execute Taiwan Market Scanner
      run: |
        python tw_scanner/tw_scanner.py

    - name: Commit and Push update.md
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add tw_scanner/output.md
        
        # 防呆機制：如果今天沒任何籌碼變動（如遇到休市），就不會產生無效 commit 報錯
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 🤖 自動更新台股籌碼 X 光機報告 [skip ci]" && git push)
