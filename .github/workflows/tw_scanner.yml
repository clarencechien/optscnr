name: tw-scanner

on:
  schedule:
    - cron: "45 13 * * 1-5"  # 13:45 UTC = 21:45 Taipei, Mon-Fri - after margin (~21:00) publishes; all 4 features complete
    - cron: "15 14 1 * *"    # monthly, 1st - backtest revalidation: re-judge the capitulation alert on accrued data
  workflow_dispatch:
    inputs:
      mode:
        description: "briefing | backtest | backfill"
        default: "briefing"

permissions:
  contents: write

concurrency:
  group: tw-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r tw_scanner/requirements.txt

      - name: Resolve mode
        id: mode
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 14 1 * *" ]; then
            echo "mode=backtest" >> "$GITHUB_OUTPUT"
          else
            echo "mode=briefing" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tw_scanner (${{ steps.mode.outputs.mode }})
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -euo pipefail
          FLAGS=""
          case "${{ steps.mode.outputs.mode }}" in
            backtest) FLAGS="--backtest" ;;
            backfill) FLAGS="--backfill" ;;
          esac
          python tw_scanner/tw_scanner.py $FLAGS \
            --config tw_scanner/config/tw_scanner_config.json \
            --output-dir tw_scanner/output

      - name: Commit results
        # Explicit existence checks - never `git add ... || true`.
        # The cache CSVs are committed too: they make every backtest
        # reproducible and spare FinMind quota on scheduled runs.
        run: |
          set -euo pipefail
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$MODE" = "backtest" ]; then
            REQUIRED="tw_scanner/output/tw_scanner_backtest.md"
          else
            REQUIRED="tw_scanner/output/tw_scanner_briefing.md tw_scanner/output/tw_scanner_state.json"
          fi
          for f in $REQUIRED; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "::error::expected output missing: $f"
              exit 1
            fi
          done
          if [ -d tw_scanner/cache ]; then
            git add tw_scanner/cache
          fi
          # 重組資料夾 README（tw_scanner + delta_radar 兩區塊，像主 scanner 一樣以 README 為報表）
          python tw_scanner/build_readme.py
          git add tw_scanner/README.md
          if git diff --cached --quiet; then
            echo "No changes to commit (weekend/holiday or unchanged)."
            exit 0
          fi
          git config user.name "tw-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash
          git commit -m "tw_scanner[${{ steps.mode.outputs.mode }}]: $(date -u +%F)"
          git push
