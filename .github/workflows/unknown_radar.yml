name: Daily Unknown Radar

on:
  schedule:
    # 跟 catalyst_fetch 同時間跑（UTC 週一到五 21:00 = 台灣早上 5:00）
    # 比 catalyst 晚 30 分鐘，避免同時搶 RSS
    - cron: '43 21 * * 0-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run unknown radar
        run: python unknown_radar.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 用 -- 跟 || true 防呆，沒檔案時不要 fail
          git add data/unknown_radar.json data/unknown_radar_history.json data/listed_companies.json 2>/dev/null || true
          if git diff --quiet --cached; then
            echo "No changes to commit"
          else
            git commit -m "🛸 Daily unknown radar [skip ci]"
            # push 前先 rebase 到最新 main：排程延遲會讓多個 workflow 擠在同一時段 push，
            # 沒 rebase 就被 non-fast-forward 拒絕、整次掃描結果丟失（2026-09-02 事故）。
            # 各 workflow 寫的檔案互不重疊，rebase 不會衝突；三次重試後仍失敗就大聲失敗。
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
              echo "::warning::push 第 $i 次失敗，$((i * 10))s 後重試"; sleep $((i * 10))
            done
            [ "$ok" = 1 ] || { echo "::error::push 三次皆失敗"; exit 1; }
          fi
