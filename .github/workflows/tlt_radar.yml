name: Weekly TLT Hedge Radar

on:
  # v2.5（PATCH #2 P0-4 方案 A）：獨立排程已移除——02:00-05:00 UTC 時段
  # yfinance 選擇權鏈常回空（8/3、8/4 連續失敗），而主掃描 23:0X UTC 抓鏈
  # 全部成功。TLT 現在由 main.py 在主掃描 session 內執行（本週已成功即跳過），
  # 本 workflow 只保留手動觸發作為備援。
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run TLT radar
        run: python tlt_radar.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tlt_radar.json data/tlt_radar_report.md data/tlt_radar_history.csv
          git diff --quiet --cached || git commit -m "📉 Weekly TLT hedge radar [skip ci]"
          # push 前先 rebase 到最新 main：排程延遲會讓多個 workflow 擠在同一時段 push，
          # 沒 rebase 就被 non-fast-forward 拒絕、整次掃描結果丟失（2026-09-02 事故）。
          # 各 workflow 寫的檔案互不重疊，rebase 不會衝突；三次重試後仍失敗就大聲失敗。
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
            echo "::warning::push 第 $i 次失敗，$((i * 10))s 後重試"; sleep $((i * 10))
          done
          [ "$ok" = 1 ] || { echo "::error::push 三次皆失敗"; exit 1; }
