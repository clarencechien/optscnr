name: Weekly TLT Hedge Radar

on:
  schedule:
    # v2.3（handoff #2 P0-1）：改每日 UTC 02:00 跑，但腳本內建「本週已成功即跳過」——
    # 實質仍是週更（該週第一次成功抓取），每日排程只是當週失敗的自動重試，
    # 不硬編週幾（週六失敗隔日自動補），單點失敗不再瞎掉整週。
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run TLT radar
        run: python tlt_radar.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tlt_radar.json data/tlt_radar_report.md data/tlt_radar_history.csv
          git diff --quiet --cached || git commit -m "📉 Weekly TLT hedge radar [skip ci]"
          git push
