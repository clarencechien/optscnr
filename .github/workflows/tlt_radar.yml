name: Weekly TLT Hedge Radar

on:
  schedule:
    # 台灣週日早上 10:00 = UTC 週六 02:00
    # 排在 fallen_saas (UTC 週六 01:00) 後面
    - cron: '0 2 * * 6'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run TLT radar
        run: python tlt_radar.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tlt_radar.json data/tlt_radar_report.md data/tlt_radar_history.csv
          git diff --quiet --cached || git commit -m "📉 Weekly TLT hedge radar [skip ci]"
          git push
