name: Daily Cigarette Butt Scanner

on:
  schedule:
    # 台灣週一到週六早上 6:00 = UTC 週日到週五 22:00
    - cron: '0 22 * * 0-5'
  workflow_dispatch: # 允許手動按按鈕觸發

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests pandas tabulate yfinance

      - name: Run Scanner
        # 加上 -u 參數，強制顯示輸出 (Unbuffered)
        run: python -u main.py

      - name: Keep only last 7 days data
        run: |
          cd data
          ls -t *.csv | tail -n +8 | xargs -I {} rm -- {} || true
          cd ..

      - name: Commit and Push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/*.csv README.md
          git commit -m "📈 Update scanner data & report [skip ci]" || exit 0
          git push
