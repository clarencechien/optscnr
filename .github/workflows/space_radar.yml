name: Daily SPCX Space Radar
on:
  schedule:
    # 每天 UTC 22:15（台灣早上 6:15），跟主 scanner 接近
    - cron: '26 22 * * 0-5'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run space radar
        run: python spcx_radar/space_radar.py
      # Option Sage（C 池沉思者）——必須排在 space_radar 之後：
      # 它唯讀 space_radar 剛寫好的 spcx_radar/output/spcx_iv_history.csv。
      # continue-on-error：Sage 掛掉不該擋住 space_radar 的 commit。
      - name: Run option sage
        run: python spcx_radar/spcx_options.py
        continue-on-error: true
      # 重組資料夾 README（space_radar + sage 兩區塊，像主 scanner 一樣以 README 為報表）
      - name: Build folder README
        run: python spcx_radar/build_readme.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "=== 檔案存在狀況 ==="
          ls -la spcx_radar/output/ spcx_radar/config/ 2>/dev/null || echo "(部分檔案不存在，正常)"
          echo "=== 逐檔 add（存在才 add）==="
          for f in \
            spcx_radar/README.md \
            spcx_radar/output/space_radar.json \
            spcx_radar/output/space_radar_report.md \
            spcx_radar/output/spcx_iv_history.csv \
            spcx_radar/output/spcx_options.json \
            spcx_radar/output/spcx_options_report.md \
            spcx_radar/output/spcx_options_history.csv \
            spcx_radar/config/spcx_dca_log.json \
            spcx_radar/config/spcx_config.json \
            spcx_radar/config/spcx_c_viewpoint.json
          do
            if [ -f "$f" ]; then
              git add "$f"
              echo "  added: $f"
            else
              echo "  skip (不存在): $f"
            fi
          done
          echo "=== staged 內容 ==="
          git status --short
          echo "=== commit + push ==="
          if git diff --quiet --cached; then
            echo "No changes to commit"
          else
            git commit -m "🚀 Daily SPCX space radar + option sage [skip ci]"
            git push
            echo "已 push 成功"
          fi
