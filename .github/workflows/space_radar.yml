name: Daily SPCX Space Radar
on:
  schedule:
    # 每天 UTC 22:15（台灣早上 6:15），跟主 scanner 接近
    # v8.8：排除 UTC 週日（台灣週一早上）——美股沒新資料，跑了只會把週五殘留價
    # 再寫進 IV 歷史（分位樣本曾被灌 20% 週末重複值）。假日由程式內新鮮度防呆擋。
    - cron: '26 22 * * 1-5'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run space radar
        run: python spcx_radar/space_radar.py
      # Option Sage（C 池沉思者）——必須排在 space_radar 之後：
      # 它唯讀 space_radar 剛寫好的 spcx_radar/output/spcx_iv_history.csv。
      # continue-on-error：Sage 掛掉不該擋住 space_radar 的 commit。
      - name: Run option sage
        run: python spcx_radar/spcx_options.py
        continue-on-error: true
      # C 池 brief（PLAN_2026-10_c_pool_alert）：把 radar + Sage + 人工回應組成 spcx_brief.json，
      # Worker /api/spcx 轉發給 /brief 橫幅、SPCX 分頁、dashboard 燈。零網路、缺檔標 NO_DATA，不該掛。
      - name: Build SPCX brief
        run: python spcx_radar/spcx_brief.py
      # 重組資料夾 README（space_radar + sage 兩區塊，像主 scanner 一樣以 README 為報表）
      - name: Build folder README
        run: python spcx_radar/build_readme.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "=== 檔案存在狀況 ==="
          ls -la spcx_radar/output/ spcx_radar/config/ 2>/dev/null || echo "(部分檔案不存在，正常)"
          echo "=== 逐檔 add（存在才 add）==="
          for f in \
            spcx_radar/README.md \
            spcx_radar/output/space_radar.json \
            spcx_radar/output/space_radar_report.md \
            spcx_radar/output/spcx_iv_history.csv \
            spcx_radar/output/spcx_options.json \
            spcx_radar/output/spcx_options_report.md \
            spcx_radar/output/spcx_options_history.csv \
            spcx_radar/output/spcx_brief.json \
            spcx_radar/config/spcx_dca_log.json \
            spcx_radar/config/spcx_config.json \
            spcx_radar/config/spcx_c_viewpoint.json \
            spcx_radar/config/spcx_c_decisions.json
          do
            if [ -f "$f" ]; then
              git add "$f"
              echo "  added: $f"
            else
              echo "  skip (不存在): $f"
            fi
          done
          echo "=== staged 內容 ==="
          git status --short
          echo "=== commit + push ==="
          if git diff --quiet --cached; then
            echo "No changes to commit"
          else
            # commit message 帶 C 池判定（PLAN §〇 缺口 1：L2 與 L0 同管道同音量——至少 git log 一眼看得出）
            LVL=$(python -c "import json;b=json.load(open('spcx_radar/output/spcx_brief.json'));c=b.get('c_pool',{});print((c.get('level') or '?')+(' '+c['transition'] if c.get('transition') else ''))" 2>/dev/null || echo "?")
            git commit -m "🚀 Daily SPCX space radar + option sage [C池 ${LVL}] [skip ci]"
            # push 前先 rebase 到最新 main：排程延遲會讓多個 workflow 擠在同一時段 push，
            # 沒 rebase 就被 non-fast-forward 拒絕、整次掃描結果丟失（2026-09-02 事故）。
            # 各 workflow 寫的檔案互不重疊，rebase 不會衝突；三次重試後仍失敗就大聲失敗。
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
              echo "::warning::push 第 $i 次失敗，$((i * 10))s 後重試"; sleep $((i * 10))
            done
            [ "$ok" = 1 ] || { echo "::error::push 三次皆失敗"; exit 1; }
            echo "已 push 成功"
          fi
      # 轉換事件推播（PLAN §五）：只在 level 變、Sage 沒跑、回應逾期第一天發。
      # 排在 commit 之後：推播管道掛了會把 run 標紅（要看得見），但資料已經入庫。
      # secrets：SPCX_NOTIFY_URL＝https://bentodrop.ai-apps.work（BentoDrop 站台根；程式自己接 /api/push）、
      #          SPCX_NOTIFY_TOKEN＝BentoDrop 設定 → API Tokens 建的 bd_… token（要勾「明文模式」）。沒設就只印不發。
      # 想改接一般 webhook：再加 env NOTIFY_FORMAT=webhook。管道驗證：本機 `python spcx_radar/notify_transition.py --test`。
      - name: Notify on C-pool transition
        if: always()
        run: python spcx_radar/notify_transition.py
        env:
          NOTIFY_URL: ${{ secrets.SPCX_NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.SPCX_NOTIFY_TOKEN }}
