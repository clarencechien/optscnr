name: Weekly Universe Update

on:
  schedule:
    # 每週日 UTC 23:00（台灣時間週一早上 7:00）
    - cron: '0 23 * * 0'
  workflow_dispatch:  # 允許手動觸發

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install yfinance pandas lxml html5lib beautifulsoup4 requests
      
      - name: Run universe update
        run: python universe_update.py
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auto_watch.json
          git diff --quiet --cached || git commit -m "🔭 Weekly universe update [skip ci]"
          git push
