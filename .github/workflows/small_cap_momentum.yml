name: Weekly Small Cap Momentum

on:
  schedule:
    # 台灣週日早上 8:00 = UTC 週六 00:00
    # 比 universe_update 早一點，這樣它們可以分散資料寫入
    - cron: '13 0 * * 6'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run small cap momentum scan
        run: python small_cap_momentum.py
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/small_caps_momentum.json
          git diff --quiet --cached || git commit -m "🎰 Weekly small cap momentum scan [skip ci]"
          # push 前先 rebase 到最新 main：排程延遲會讓多個 workflow 擠在同一時段 push，
          # 沒 rebase 就被 non-fast-forward 拒絕、整次掃描結果丟失（2026-09-02 事故）。
          # 各 workflow 寫的檔案互不重疊，rebase 不會衝突；三次重試後仍失敗就大聲失敗。
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
            echo "::warning::push 第 $i 次失敗，$((i * 10))s 後重試"; sleep $((i * 10))
          done
          [ "$ok" = 1 ] || { echo "::error::push 三次皆失敗"; exit 1; }
